# CD config defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# cd owns its OWN named datasource + persistence unit + Flyway lineage: a separate file-based H2
# under ~/.qits/data/cd, never sharing any other context's DB or migration history. Because it is a
# separate physical DB, cd_application.repo_id is a plain String column with NO cross-boundary FK —
# a deleted repository simply leaves environments behind as dangling configuration. Tests override
# the url to in-memory H2 (see src/test/resources in the service module).
#
# The URL carries NO AUTO_SERVER, for the reason the ci jar documents at length: AUTO_SERVER makes
# the first opener start H2's own TCP server, whose classes are not in the native image, and the
# binary dies at boot on a default no JVM test ever used. A packaged single-process service does not
# need a second process opening the same file.
quarkus.datasource.cd.db-kind=h2
quarkus.datasource.cd.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/cd/h2/cd

# A dedicated persistence unit bound to the cd datasource, owning only this module's entities.
quarkus.hibernate-orm.cd.datasource=cd
quarkus.hibernate-orm.cd.packages=eu.wohlben.qits.cd.entity

# Own Flyway lineage at a distinct classpath location.
quarkus.flyway.cd.migrate-at-start=true
quarkus.flyway.cd.baseline-on-migrate=true
quarkus.flyway.cd.locations=classpath:db/cd/migration

# The docker-compatible CLI cd shells out to. Pointing it at anything else (podman) makes supplying
# that CLI the deployment's problem — cd's docker vocabulary is container lifecycle only (pull,
# run, inspect, logs, rm, ps, network create/inspect/rm; never exec, never build).
qits.cd.container-runtime=docker

# --- the image-reference convention: <registry-host>/<image-repository>/<application>:<sha> ------
#
# registry-host is the OCI registry as resolvable BY THE DOCKER DAEMON, which is what performs the
# pull — not by this process. On qits-net that is the qits-artifacts alias and its container port.
# Two things about that value are easy to get wrong in a deployment:
#   * the daemon must either trust it (insecure-registries) or reach it over TLS — a plain-HTTP
#     registry the daemon does not trust fails every pull with an https error;
#   * pulls there are anonymous always, so no docker login is needed to consume.
#
# image-repository is the first path segment — the artifact_repository row (type oci-images) that
# must exist in qits-artifacts before anything can push. `qits` is the platform's own; everything
# the platform deploys is expected under it as <application-name>:<commit-sha>. Publishing that tag
# on a green build is the producer's half of the contract; a green build nothing published for is
# recorded here as IMAGE_MISSING rather than invented around.
qits.cd.registry-host=qits-artifacts:8080
qits.cd.image-repository=qits

# --- the health gate ------------------------------------------------------------------------------
#
# The gate is docker's own healthcheck, injected at `docker run` (--health-cmd curl'ing
# http://localhost:8080<path> inside the container) and polled via `docker inspect` — cd itself
# never joins an environment's network, so the probe has to run where the network already is. Two
# consequences the deployment owns: the image must carry curl (the platform's ubi-minimal images
# do), and the application must listen on 8080 (the platform's one exposed port, the same
# convention the gateway and compose files assume).
#
# default-health-path is what an application that names none gets. The platform's own services
# serve health under their gateway segment (/<segment>/q/health/ready), so a qits service tracked
# by an environment names its own path; /q/health/ready is the right default for everything else
# built on the platform's conventions.
qits.cd.default-health-path=/q/health/ready
qits.cd.health-interval-seconds=3
qits.cd.health-retries=3
qits.cd.health-start-period-seconds=10
qits.cd.health-timeout-seconds=120

# How long a pull may take before it is recorded as a failed deployment — mostly a bound on cold
# image size over a slow link.
qits.cd.pull-timeout-seconds=600

# Bounded tail kept of any docker output recorded onto a deployment (pull errors, log captures).
qits.cd.output-max-chars=65536

# There is NO machine token here, and that is a decision, not an omission. Every /cd/* path —
# including the build-succeeded intake — sits behind qits-gateway's session policy (nothing of cd
# is on the gateway's token-free allowlist), and on qits-net callers are trusted; qits-ci dials
# the intake there directly. The qits.ci.token pattern exists for paths that ARE allowlisted at
# the gateway, and cd has none. If the intake ever needs a session-free front-door spelling, the
# gateway allowlist entry and a token filter here come back together — see PublicPaths in
# qits-gateway.
