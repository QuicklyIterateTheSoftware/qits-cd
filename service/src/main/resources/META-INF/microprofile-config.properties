# Identity from the edge. Authentication happens at qits-gateway; this service resolves a
# principal from a trusted header and authenticates nothing.
#
# Shipped as microprofile-config.properties for symmetry with the sibling services — nothing here
# is a variant: services have no variant to select.

# The header qits-gateway asserts. It sits under the gateway's reserved X-Qits-* prefix, which the
# gateway strips from every inbound request unconditionally — that stripping is what makes believing
# this header safe. Overridable per deployment, but there is no reason to.
qits.auth.forward.user-header=X-Qits-User

# The everyday dev/test identity when nothing injects the header — no gateway fronts `quarkus:dev`
# or the test suite, and this is what keeps them runnable with no auth setup. LaunchMode-guarded in
# ForwardAuthMechanism: a prod (NORMAL) build ignores it even if the property leaks in via env.
%dev.qits.auth.forward.dev-user=dev
%test.qits.auth.forward.dev-user=dev
