# The application config for qits-cd as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `cd` module's own defaults (its
# datasource, Flyway lineage, registry convention, health gate, token) stay there; a deployment
# still overrides any of them by env.

quarkus.application.name=qits-cd

# The prefix every route of this service lives under: /<segment>/api, where the segment is the
# service name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /cd/* reaches
# qits-cd with the path untouched — so the service itself has to serve /cd/..., and there is no
# unprefixed form. This holds for service-to-service calls on qits-net too; they do not pass
# through the gateway but they address the same paths.
#
# Without it the intake moves to /events/build-succeeded and qits-ci's notifier — which POSTs to a
# configured qits.cd.intake-url and swallows delivery failures at debug — silently stops
# delivering. Nothing errors; deployments simply never happen. The suite inherits this file rather
# than keeping its own copy, so a test run cannot be green about a prefix that never ships.
quarkus.rest.path=/cd/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway.
quarkus.http.non-application-root-path=/cd/q

# --- the API document -------------------------------------------------------------------------
# Served at /cd/q/openapi, with the browsable UI at /cd/q/swagger-ui — both follow
# quarkus.http.non-application-root-path above. always-include because swagger-ui is a
# dev-mode-only extension by default, and the point of packaging these as processes is that each
# documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-cd API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   QUARKUS_DATASOURCE_CD_JDBC_URL   The image refuses to boot without it (the ${user.home}
#                                    default has nowhere to land under uid 1001 — the same
#                                    refuse-to-boot-unconfigured stance as qits-ci). Point it at
#                                    the mounted volume: jdbc:h2:file:/data/cd/h2/cd.
#
#   QITS_CD_REGISTRY_HOST            Where the DOCKER DAEMON pulls images from. The qits-net
#                                    default only resolves for a daemon whose containers sit on
#                                    qits-net; host-run docker wants the host-published address.
#
#   QITS_CD_TOKEN                    Blank means the write surface (environments and the
#                                    build-succeeded intake) is unauthenticated. That is the dev
#                                    default and stays a no-op guard until a deployment sets it.
#                                    Note the environment surface starts containers on the host.

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-cd` rather than qits-cd-service-<version>-runner, so `-Dnative`
# produces target/qits-cd and the process is identifiable in `ps` — which matters here for the same
# reason it does in qits-ci: this service's own work is spawning docker children, and the process
# tree gets read while debugging a deployment. The name is spelled TWICE: here, and as failsafe's
# native.image.path in service/pom.xml. They move together — if they drift, the native IT launches
# nothing and passes.
quarkus.package.output-name=qits-cd
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default.
quarkus.otel.logs.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
