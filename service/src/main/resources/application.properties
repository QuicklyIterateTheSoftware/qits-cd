# The application config for qits-cd as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `cd` module's own defaults (its
# datasource, Flyway lineage, registry convention, health gate) stay there; a deployment still
# overrides any of them by env.

quarkus.application.name=qits-cd

# The prefix every route of this service lives under: /<segment>/api, where the segment is the
# service name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /cd/* reaches
# qits-cd with the path untouched — so the service itself has to serve /cd/..., and there is no
# unprefixed form. This holds for service-to-service calls on qits-net too; they do not pass
# through the gateway but they address the same paths.
#
# Without it the intake moves to /events/build-succeeded and qits-ci's notifier — which POSTs to a
# configured qits.cd.intake-url and swallows delivery failures at debug — silently stops
# delivering. Nothing errors; deployments simply never happen. The suite inherits this file rather
# than keeping its own copy, so a test run cannot be green about a prefix that never ships.
quarkus.rest.path=/cd/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway.
quarkus.http.non-application-root-path=/cd/q

# --- machine identity ---------------------------------------------------------------------------
# Two tracks of identity reach this service and they do not replace each other. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User,
# and qits-auth-core's ForwardAuthMechanism reads it. A request WITH a bearer is MACHINE traffic:
# quarkus-oidc validates the token against qits-idp and qits-auth-core's MachineAuth decides what it
# covers.
#
# This service's own id — the aud value a token minted for it carries, and the client id qits-idp
# knows it by. Named here rather than in the cd jar because it is an identity of the DEPLOYMENT, and
# it is referenced below so the two cannot drift.
qits.auth.machine.audience=qits-cd

# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core). Off,
# every MachineAuth.require* call returns at once and the intake behaves exactly as it did before —
# network trust, no bearer needed. That is what lets this code deploy before qits-idp exists. Turn
# it on per deployment with QITS_AUTH_MACHINE_REQUIRED=true once qits-idp is up and qits-ci sends a
# bearer; startup then fails if qits.auth.machine.audience above is missing, rather than accepting a
# token minted for another service.
#
# Validation follows that gate rather than standing on its own, which is what lets this code deploy
# before qits-idp exists: with the gate off there is no OIDC tenant, so nothing fetches a JWKS,
# nothing waits on a host named qits-idp, and a clone-alone `./mvnw verify` needs no issuer at all.
# There is no third state — either the gate and the validation are both on, or both off. Same shape
# in qits-ci and qits-artifacts.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
quarkus.oidc.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery OFF, path given. The issuer string is a public URL while the fetch happens internally on
# qits-net, so a discovery document fetched from the issuer would name addresses this process cannot
# reach. The path is JOINED onto auth-server-url, so it is `jwks`, not `/idp/jwks`. Set
# quarkus.oidc.token.issuer as well the day the two diverge.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# A token minted for another service is not accepted here. Referenced, not repeated: one spelling of
# qits-cd for the guard and for validation.
quarkus.oidc.token.audience=${qits.auth.machine.audience}

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. With the gate off there is no tenant to reach it
# with; with the gate on, the boot-time JWKS fetch fails to a WARN ("OIDC server is not available
# yet, an attempt to connect will be made during the first request") and startup continues. Gate off
# is the state every deployment is in until qits-idp ships, and the state the test suite runs in:
# no idp, no tenant, every existing test untouched by this block.

# --- the API document -------------------------------------------------------------------------
# Served at /cd/q/openapi, with the browsable UI at /cd/q/swagger-ui — both follow
# quarkus.http.non-application-root-path above. always-include because swagger-ui is a
# dev-mode-only extension by default, and the point of packaging these as processes is that each
# documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-cd API
quarkus.swagger-ui.always-include=true

# --- the web UI ---------------------------------------------------------------------------------
# The Angular SPA in service/src/main/webui — a submodule on qits-spa-cd's own main, not a vendored
# copy. Quinoa runs its npm build during augmentation and registers the output as static resources,
# so one process serves the UI and the API and the gateway needs no second upstream.
#
# TWO THINGS THIS ADDS TO A BUILD, both part of this repo's clone-alone rule:
#   - the submodule has to be checked out. `git clone` alone leaves src/main/webui empty and Quinoa
#     then finds no package.json ("No package.json found in Web UI directory"); an uninitialised
#     gitlink is an empty directory, which is the one case Quinoa treats as a misconfiguration
#     rather than as "no client". `git submodule update --init` is part of a fresh clone here.
#   - an npm and a node have to be on PATH. The Angular CLI at 21 wants node ^20.19 || ^22.12 || >=24;
#     the platform's pin is 22.22.0, and the mandrel builder image in docker/Dockerfile ships no node
#     at all — which is why the two package-manager-install flags exist THERE and nowhere else.
# Neither reaches `./mvnw test`: Quinoa is disabled in test mode by default, so the suite is green
# with an empty webui dir and no node at all. Anything that reaches `package` needs both, and
# `./mvnw verify` runs `package` on its way to failsafe.
#
# The SPA is served at /cd — this service's gateway segment, the same one quarkus.rest.path hangs
# /cd/api off. They do not collide, and what keeps them apart is
# quarkus.quinoa.ignored-path-prefixes below. The segment is now spelled in FOUR places that move
# together: this key, quarkus.rest.path, quarkus.http.non-application-root-path, and the client's
# own baseHref in qits-spa-cd's angular.json — the fourth in another repository, where no build here
# can check it. A baseHref that disagrees yields a page that loads and then fetches its own
# JavaScript from the wrong place, and no server-side test can see it.
quarkus.quinoa.ui-root-path=/cd

# Deep links. Without this a GET /cd/some/route is a 404 from the static handler rather than the
# SPA's own route — the client only ever sees its router if index.html is what comes back for a path
# the build produced no file for.
quarkus.quinoa.enable-spa-routing=true

# Where Angular leaves the bundle, relative to the webui dir. `dist/<project>/browser` is the
# application builder's layout since Angular 17 (the browser/ level is where the SSR split put it).
# Quinoa's Angular detection can resolve this from the client's angular.json on its own; it is
# pinned anyway because the platform's style is to spell a value where its failure would land — the
# name in it is the SPA's package name, and a rename fails here loudly ("Quinoa build directory not
# found") instead of shipping an empty UI.
quarkus.quinoa.build-dir=dist/qits-spa-cd/browser

# What SPA routing must NOT swallow. The re-route is a catch-all at /cd/* registered near-last, so
# anything with a real route in front of it still wins — but a request matching NO route is rerouted
# to index.html and answers 200 text/html instead of 404. That is fine for a person, who gets the
# client's own not-found page, and wrong for a machine, which parses index.html as garbage data: the
# correct answer to a mistyped machine path is a 404. The intake qits-ci POSTs fire-and-forget is
# exactly such a machine caller, and it is the one that would never report the mistake.
#
# Quinoa DERIVES this list when the key is unset, from quarkus.rest.path and
# quarkus.http.non-application-root-path — exactly /api and /q — and that derivation IS this
# service's complete machine surface today: every route here is JAX-RS under quarkus.rest.path (the
# environment, deployment and build-succeeded-intake controllers all sit below /cd/api), and this
# service registers nothing on the Vert.x router but the bare-segment redirect at /cd, which is
# outside /cd/* and therefore not Quinoa's to swallow. The key is spelled out anyway, ahead of the
# need: the platform's convention is that a new literal route and its prefix entry land in the SAME
# commit, and the list being already present is what makes that a one-line change rather than an
# omission discovered from a caller parsing index.html.
#
# THREE TRAPS, all measured on sibling services:
#   - setting the key REPLACES the derivation rather than extending it, so /api and /q must be
#     repeated by hand. Drop either and the API answers mistyped paths with index.html.
#   - the values are matched AFTER ui-root-path is stripped, so they are RELATIVE. `/cd/api`
#     written here matches nothing at all and is indistinguishable from leaving the key unset —
#     the failure that hides. `/api`, never `/cd/api`.
#   - websockets-next claims only the UPGRADE HANDSHAKE, so a socket path needs its own entry even
#     though route ordering protects the upgrade. cd has no socket today; if one is ever added, its
#     literal joins this line in the same commit. Measured on qits-ci's /ci/daemon: before the
#     prefix was ignored, a plain GET answered 200 index.html from a build that was green.
#
#   /api  JAX-RS (quarkus.rest.path=/cd/api)
#   /q    openapi, swagger-ui, health (quarkus.http.non-application-root-path=/cd/q)
quarkus.quinoa.ignored-path-prefixes=/api,/q

# quarkus.quinoa.package-manager-install is deliberately ABSENT and must stay absent. A local or CI
# `mvnw` build uses the node on PATH, so no build silently downloads a toolchain; the two install
# flags live in exactly one place, docker/Dockerfile's build stage, because the Mandrel builder image
# ships no node. A machine with no node fails at Quinoa's npm invocation — that is the intended
# failure, and the fix is node on PATH, not this key.

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   QUARKUS_DATASOURCE_CD_JDBC_URL   The image refuses to boot without it (the ${user.home}
#                                    default has nowhere to land under uid 1001 — the same
#                                    refuse-to-boot-unconfigured stance as qits-ci). Point it at
#                                    the mounted volume: jdbc:h2:file:/data/cd/h2/cd.
#
#   QITS_ARTIFACTS_REGISTRY_HOST     Where the DOCKER DAEMON pulls images from. The qits-net
#                                    default only resolves for a daemon whose containers sit on
#                                    qits-net; host-run docker wants the host-published address.
#
#
# There is no QITS_CD_TOKEN and there never will be. cd has no static machine token; machine
# callers present a qits-idp bearer, which is a signed statement of identity rather than a shared
# string. What a deployment MAY set, once qits-idp is up and qits-ci sends one:
#
#   QITS_AUTH_MACHINE_REQUIRED=true    Turns enforcement on for this service. Unset (the shipped
#                                      state) the intake keeps accepting credential-free calls
#                                      from qits-net, exactly as before. Set it only after the
#                                      sender is sending — a bearer nobody mints is a 401 on every
#                                      green build, and the sender swallows delivery failures.
#
#   QUARKUS_OIDC_AUTH_SERVER_URL       Override when the idp is not at the qits-net default above.

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-cd` rather than qits-cd-service-<version>-runner, so `-Dnative`
# produces target/qits-cd and the process is identifiable in `ps` — which matters here for the same
# reason it does in qits-ci: this service's own work is spawning docker children, and the process
# tree gets read while debugging a deployment. The name is spelled TWICE: here, and as failsafe's
# native.image.path in service/pom.xml. They move together — if they drift, the native IT launches
# nothing and passes.
quarkus.package.output-name=qits-cd
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default.
quarkus.otel.logs.enabled=true

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
